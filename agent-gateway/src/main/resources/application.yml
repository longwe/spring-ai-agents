server:
  port: 8080

spring:
  application:
    name: agent-gateway
  mvc:
    problemdetails:
      enabled: true
  ai:
    anthropic:
      # Never put the key here; export ANTHROPIC_API_KEY in your shell.
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
          max-tokens: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info

tellermesh:
  core-banking:
    base-url: ${CORE_BANKING_URL:http://localhost:8090}
