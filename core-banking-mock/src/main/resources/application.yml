server:
  port: 8090

spring:
  application:
    name: core-banking-mock
  datasource:
    url: ${CORE_DB_URL:jdbc:postgresql://localhost:5433/corebanking}
    username: ${CORE_DB_USER:tellermesh}
    password: ${CORE_DB_PASSWORD:tellermesh}
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
